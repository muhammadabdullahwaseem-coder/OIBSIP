<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | OIBSIP Auth System</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- Ambient Glowing Orbs -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <span class="brand-badge">OIBSIP Task 4</span>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to access your protected dashboard</p>
            </div>

            <!-- Alert Message Box -->
            <div id="alert-box" class="alert-box hidden" role="alert"></div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form" novalidate>
                
                <div class="form-group">
                    <label for="loginInput" class="form-label">Username or Email</label>
                    <input type="text" id="loginInput" name="loginInput" class="input-field" placeholder="Enter username or email" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="input-field" placeholder="••••••••" required>
                </div>

                <button type="submit" id="submit-btn" class="btn-submit">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register" class="auth-link">Create One</a>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const alertBox = document.getElementById('alert-box');
            const submitBtn = document.getElementById('submit-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.className = 'alert-box hidden';

                const loginInput = document.getElementById('loginInput').value.trim();
                const password = document.getElementById('password').value;

                if (!loginInput || !password) {
                    showAlert('Please enter both username/email and password.', 'danger');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Authenticating...';

                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ loginInput, password })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        showAlert(data.message, 'success');
                        setTimeout(() => {
                            window.location.href = data.redirect || '/dashboard';
                        }, 800);
                    } else {
                        // Display generic error message returned by server
                        showAlert(data.error || 'Invalid username/email or password.', 'danger');
                    }
                } catch (err) {
                    showAlert('Network error. Please try again.', 'danger');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            });

            function showAlert(msg, type) {
                alertBox.textContent = msg;
                alertBox.className = `alert-box alert-${type}`;
            }
        });
    </script>
</body>
</html>
